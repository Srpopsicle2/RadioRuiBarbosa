<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rádio Rb</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0a2185, #f18831);
  color: white;
}

header {
  text-align: center;
  padding: 20px;
}

.player {
  text-align: center;
  margin: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #f18831;
  color: white;
  cursor: pointer;
}

.slider {
  width: 90%;
  max-width: 600px;
  margin: auto;
  overflow: hidden;
}

.slides {
  display: flex;
  transition: 0.5s;
}

.slides img {
  width: 100%;
}

.section {
  padding: 20px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.1);
  margin: 10px auto;
  padding: 15px;
  border-radius: 15px;
  width: 80%;
}

.team {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

.member {
  margin: 10px;
}

.member img {
  width: 100px;
  border-radius: 50%;
}

.chat {
  background: rgba(0,0,0,0.2);
  padding: 10px;
  width: 90%;
  max-width: 400px;
  margin: auto;
  border-radius: 15px;
}

.messages {
  height: 150px;
  overflow-y: auto;
  text-align: left;
  margin-bottom: 10px;
}

input {
  width: 70%;
  padding: 5px;
  border-radius: 10px;
  border: none;
}
</style>
</head>

<body>

<header>
  <h1>📻 Rádio RB</h1>
  <p>onde cada voz vira frequência</p>
</header>

<div class="player">
  <button id="playButton" onclick="toggleAudio()">▶ Play</button>
  <audio id="audio"></audio>
</div>

<div class="slider">
  <div class="slides" id="slides">
    <img src="imagens/1.png">
    <img src="imagens/2.png">
    <img src="imagens/3.png">
    <img src="imagens/4.png">
    <img src="imagens/5.png">
    <img src="imagens/6.png">
    <img src="imagens/7.png">
    <img src="imagens/8.png">
    <img src="imagens/9.png">
    <img src="imagens/10.png">
    <img src="imagens/11.png">
  </div>
</div>

<div class="section">
  <h2>📅 Programação</h2>
  <div class="card">08:00 - Música e Motivação</div>
  <div class="card">10:00 - Notícias da Escola</div>
  <div class="card">14:00 - Pedido dos Alunos</div>
</div>

<div class="section">
  <h2>👥 Nossa Equipe</h2>
  <div class="team">
    <div class="member">
      <img src="https://i.pravatar.cc/100">
      <p>Locutor 1</p>
    </div>
    <div class="member">
      <img src="https://i.pravatar.cc/101">
      <p>Locutor 2</p>
    </div>
  </div>
</div>

<div class="section">
  <h2>💬 Chat dos ouvintes</h2>
  <div class="chat">
    <div class="messages" id="chatBox"></div>
    <input id="msg" placeholder="mande tua mensagem...">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const slides = document.getElementById("slides");
const totalSlides = slides.children.length;
const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");

const ResetUser = true;
let isUserPlaying = false;
let User = localStorage.getItem("user") || "";
let slideIndex = 0;

let currentOverlayAudio = null;
let overlayType = null;
let resumeMusicAfterOverlay = false;
let overlayPausedByUser = false;
let syncBlocked = false;

if (ResetUser === true) {
  localStorage.removeItem("user");
}

const socket = io();

function updatePlayButton() {
  const somethingPlaying =
    (currentOverlayAudio && !currentOverlayAudio.paused) ||
    (!audio.paused && isUserPlaying);

  playButton.innerText = somethingPlaying ? "⏸ Pause" : "▶ Play";
}

function stopOverlay() {
  if (currentOverlayAudio) {
    currentOverlayAudio.pause();
    currentOverlayAudio.currentTime = 0;
    currentOverlayAudio = null;
  }

  overlayType = null;
  overlayPausedByUser = false;
  resumeMusicAfterOverlay = false;
}

function pauseEverythingForOverlay() {
  if (!audio.paused) {
    resumeMusicAfterOverlay = isUserPlaying;
  } else {
    resumeMusicAfterOverlay = false;
  }

  audio.pause();
  syncBlocked = true;
}

function finishOverlayAndResumeMusic() {
  currentOverlayAudio = null;
  overlayType = null;
  overlayPausedByUser = false;

  if (resumeMusicAfterOverlay && isUserPlaying) {
    syncBlocked = false;
    audio.play().catch(() => {});
  } else {
    syncBlocked = false;
  }

  updatePlayButton();
}

function createOverlayAudio(audioBuffer, mimeType) {
  let bytes;

  if (audioBuffer instanceof ArrayBuffer) {
    bytes = new Uint8Array(audioBuffer);
  } else if (audioBuffer && audioBuffer.data) {
    bytes = new Uint8Array(audioBuffer.data);
  } else if (audioBuffer instanceof Uint8Array) {
    bytes = audioBuffer;
  } else if (Array.isArray(audioBuffer)) {
    bytes = new Uint8Array(audioBuffer);
  } else {
    bytes = new Uint8Array(audioBuffer);
  }

  const blob = new Blob([bytes], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const overlay = new Audio(url);

  overlay.onended = () => {
    URL.revokeObjectURL(url);
    finishOverlayAndResumeMusic();
  };

  overlay.onerror = () => {
    URL.revokeObjectURL(url);
    finishOverlayAndResumeMusic();
  };

  return overlay;
}

socket.on("volumeUpdate", volume => {
  audio.volume = volume;
});

fetch("/volume")
  .then(r => r.json())
  .then(data => {
    if (typeof data.volume === "number") {
      audio.volume = data.volume;
    }
  });

socket.on("playlistUpdated", () => {
  syncAudio();
});

socket.on("priorityAudio", audioBuffer => {
  if (currentOverlayAudio) {
    currentOverlayAudio.pause();
    currentOverlayAudio.currentTime = 0;
    currentOverlayAudio = null;
  }

  pauseEverythingForOverlay();

  currentOverlayAudio = createOverlayAudio(audioBuffer, "audio/mpeg");
  overlayType = "priority";
  overlayPausedByUser = false;

  currentOverlayAudio.play().then(() => {
    updatePlayButton();
  }).catch(() => {
    finishOverlayAndResumeMusic();
  });
});

socket.on("speechAudio", audioBuffer => {
  if (currentOverlayAudio) {
    currentOverlayAudio.pause();
    currentOverlayAudio.currentTime = 0;
    currentOverlayAudio = null;
  }

  pauseEverythingForOverlay();

  currentOverlayAudio = createOverlayAudio(audioBuffer, "audio/webm");
  overlayType = "speech";
  overlayPausedByUser = false;

  currentOverlayAudio.play().then(() => {
    updatePlayButton();
  }).catch(() => {
    finishOverlayAndResumeMusic();
  });
});

socket.on("chat message", msg => {
  const box = document.getElementById("chatBox");
  const p = document.createElement("p");
  p.textContent = msg;
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
});

socket.on("chat history", msgs => {
  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  msgs.forEach(msg => {
    const p = document.createElement("p");
    p.textContent = msg;
    box.appendChild(p);
  });

  box.scrollTop = box.scrollHeight;
});

window.sendMsg = function () {
  const input = document.getElementById("msg");

  if (!User) {
    while (User === "") {
      User = prompt("Fale seu usuário");
    }

    localStorage.setItem("user", User);
  }

  if (input.value !== "") {
    socket.emit("chat message", User + ": " + input.value);
    input.value = "";
  }
};

async function syncAudio() {
  try {
    if (syncBlocked) return;

    const res = await fetch("/status");
    const data = await res.json();

    if (!data.music) return;

    const newSrc = "/audios/" + encodeURIComponent(data.music);

    if (!audio.src.includes(encodeURIComponent(data.music)) && !audio.src.includes(data.music)) {
      audio.src = newSrc;
      audio.load();

      if (isUserPlaying && !currentOverlayAudio) {
        audio.play().catch(() => {});
      }
    }

    if (!currentOverlayAudio && Math.abs(audio.currentTime - data.time) > 10) {
      try {
        audio.currentTime = data.time;
      } catch {}
    }
  } catch (err) {
    console.error(err);
  }
}

audio.addEventListener("ended", () => {
  setTimeout(syncAudio, 300);
});

syncAudio();
setInterval(syncAudio, 3000);

setInterval(() => {
  slideIndex = (slideIndex + 1) % totalSlides;
  slides.style.transform = `translateX(-${slideIndex * 100}%)`;
}, 1500);

function toggleAudio() {
  if (currentOverlayAudio) {
    if (currentOverlayAudio.paused) {
      currentOverlayAudio.play().then(() => {
        overlayPausedByUser = false;
        updatePlayButton();
      }).catch(() => {});
    } else {
      currentOverlayAudio.pause();
      overlayPausedByUser = true;
      updatePlayButton();
    }
    return;
  }

  if (isUserPlaying) {
    audio.pause();
    isUserPlaying = false;
  } else {
    isUserPlaying = true;
    audio.play().catch(() => {});
  }

  updatePlayButton();
}
</script>

</body>
</html>
