<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0b5d1e, #1b8d36);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 360px;
      background: #111;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2196F3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      text-align: center;
      margin-top: 12px;
      color: #ff4d4d;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <form class="box" method="POST" action="/admin">
    <h1>🔒 Admin</h1>

    <input
      type="password"
      name="password"
      placeholder="Digite a senha"
      required
    >

    <button type="submit">Entrar</button>

    <div class="msg" id="erro">
      Senha inválida!
    </div>
  </form>

  <script>
    const params = new URLSearchParams(window.location.search);

    if (params.get('erro') === '1') {
      document.getElementById('erro').style.display = 'block';
    }
  </script>
</body>
</html>
